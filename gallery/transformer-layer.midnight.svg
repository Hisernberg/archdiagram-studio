<svg xmlns="http://www.w3.org/2000/svg" width="950" height="1200" viewBox="0 0 950 1200" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Pre-norm transformer layer</title>
<desc id="diagram-description">Residual streams, causal self-attention, and position-wise feed-forward computation.. input: Residual stream B x T x d_model; norm1: Layer normalization Normalize the last dimension; attention: Causal self-attention Multi-head attention + projection; add1: + ; norm2: Layer normalization Normalize the last dimension; ffn: Feed-forward network d_model -&gt; d_ff -&gt; d_model; add2: + ; output: Updated residual B x T x d_model. input to norm1:  (data); norm1 to attention:  (data); attention to add1:  (data); add1 to norm2:  (data); norm2 to ffn:  (data); ffn to add2:  (data); add2 to output:  (data); input to add1: residual (data); add1 to add2: residual (data)</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#A9BDD8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="100%" height="100%" fill="#101827"/>
<g font-family="Inter, DejaVu Sans, Arial, sans-serif">
<text x="48" y="50" fill="#F1F5F9" font-size="29" font-weight="700" text-anchor="start">Pre-norm transformer layer</text>
<text x="48" y="77" fill="#B5C4D9" font-size="13" font-weight="400" text-anchor="start">Residual streams, causal self-attention, and position-wise feed-forward computation.</text>
<path d="M 48 104 h 28" stroke="#A9BDD8" stroke-width="1.7" fill="none" stroke-dasharray=""/>
<text x="84" y="108" fill="#B5C4D9" font-size="10.5" font-weight="400" text-anchor="start">Data flow</text>
<path d="M 188 104 h 28" stroke="#A9BDD8" stroke-width="1.7" fill="none" stroke-dasharray="7 5"/>
<text x="224" y="108" fill="#B5C4D9" font-size="10.5" font-weight="400" text-anchor="start">Control</text>
<path d="M 316 104 h 28" stroke="#A9BDD8" stroke-width="1.7" fill="none" stroke-dasharray="2 5"/>
<text x="352" y="108" fill="#B5C4D9" font-size="10.5" font-weight="400" text-anchor="start">Feedback</text>
<g data-group="layer"><rect x="280" y="245" width="560" height="775" rx="14" fill="#172236" stroke="#435470" stroke-dasharray="5 5"/>
<text x="298" y="270" fill="#B5C4D9" font-size="11" font-weight="600" text-anchor="start">One decoder-style block / repeat N times</text>
</g>
<path d="M 475 220 L 475 255 L 475 290" stroke="#A9BDD8" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 475 360 L 475 385 L 475 410" stroke="#A9BDD8" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 475 500 L 475 527.5 L 475 555" stroke="#A9BDD8" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 475 605 L 475 632.5 L 475 660" stroke="#A9BDD8" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 475 730 L 475 755 L 475 780" stroke="#A9BDD8" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 475 870 L 475 900 L 475 930" stroke="#A9BDD8" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 475 980 L 475 1015 L 475 1050" stroke="#A9BDD8" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 620 185 L 765 185 L 765 580 L 500 580" stroke="#A9BDD8" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 500 580 L 810 580 L 810 955 L 500 955" stroke="#A9BDD8" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<g id="node-input" data-role="input"><title>Residual stream: B x T x d_model</title>
<rect x="330" y="150" width="290" height="70" rx="10" fill="#202E44" stroke="#93C5FD" stroke-width="1.6"/>
<path d="M 342 164 v 42" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
<text x="475" y="178.5" fill="#F1F5F9" font-size="15" font-weight="600" text-anchor="middle">Residual stream</text>
<text x="475" y="202.5" fill="#B5C4D9" font-size="11.5" font-weight="400" text-anchor="middle">B x T x d_model</text>
</g>
<g id="node-norm1" data-role="compute"><title>Layer normalization: Normalize the last dimension</title>
<rect x="330" y="290" width="290" height="70" rx="10" fill="#202E44" stroke="#5EEAD4" stroke-width="1.6"/>
<path d="M 342 304 v 42" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round"/>
<text x="475" y="318.5" fill="#F1F5F9" font-size="15" font-weight="600" text-anchor="middle">Layer normalization</text>
<text x="475" y="342.5" fill="#B5C4D9" font-size="11.5" font-weight="400" text-anchor="middle">Normalize the last dimension</text>
</g>
<g id="node-attention" data-role="model"><title>Causal self-attention: Multi-head attention + projection</title>
<rect x="330" y="410" width="290" height="90" rx="10" fill="#202E44" stroke="#C4B5FD" stroke-width="1.6"/>
<path d="M 342 424 v 62" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
<text x="475" y="448.5" fill="#F1F5F9" font-size="15" font-weight="600" text-anchor="middle">Causal self-attention</text>
<text x="475" y="472.5" fill="#B5C4D9" font-size="11.5" font-weight="400" text-anchor="middle">Multi-head attention + projection</text>
</g>
<g id="node-add1" data-role="control"><title>+: </title>
<ellipse cx="475" cy="580" rx="25" ry="25" fill="#202E44" stroke="#CBD5E1" stroke-width="1.7"/>
<text x="475" y="585" fill="#F1F5F9" font-size="15" font-weight="600" text-anchor="middle">+</text>
</g>
<g id="node-norm2" data-role="compute"><title>Layer normalization: Normalize the last dimension</title>
<rect x="330" y="660" width="290" height="70" rx="10" fill="#202E44" stroke="#5EEAD4" stroke-width="1.6"/>
<path d="M 342 674 v 42" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round"/>
<text x="475" y="688.5" fill="#F1F5F9" font-size="15" font-weight="600" text-anchor="middle">Layer normalization</text>
<text x="475" y="712.5" fill="#B5C4D9" font-size="11.5" font-weight="400" text-anchor="middle">Normalize the last dimension</text>
</g>
<g id="node-ffn" data-role="model"><title>Feed-forward network: d_model -&gt; d_ff -&gt; d_model</title>
<rect x="330" y="780" width="290" height="90" rx="10" fill="#202E44" stroke="#C4B5FD" stroke-width="1.6"/>
<path d="M 342 794 v 62" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
<text x="475" y="818.5" fill="#F1F5F9" font-size="15" font-weight="600" text-anchor="middle">Feed-forward network</text>
<text x="475" y="842.5" fill="#B5C4D9" font-size="11.5" font-weight="400" text-anchor="middle">d_model -&gt; d_ff -&gt; d_model</text>
</g>
<g id="node-add2" data-role="control"><title>+: </title>
<ellipse cx="475" cy="955" rx="25" ry="25" fill="#202E44" stroke="#CBD5E1" stroke-width="1.7"/>
<text x="475" y="960" fill="#F1F5F9" font-size="15" font-weight="600" text-anchor="middle">+</text>
</g>
<g id="node-output" data-role="output"><title>Updated residual: B x T x d_model</title>
<rect x="330" y="1050" width="290" height="70" rx="10" fill="#202E44" stroke="#6EE7B7" stroke-width="1.6"/>
<path d="M 342 1064 v 42" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round"/>
<text x="475" y="1078.5" fill="#F1F5F9" font-size="15" font-weight="600" text-anchor="middle">Updated residual</text>
<text x="475" y="1102.5" fill="#B5C4D9" font-size="11.5" font-weight="400" text-anchor="middle">B x T x d_model</text>
</g>
<rect x="731.8" y="341" width="66.4" height="20" rx="5" fill="#101827"/>
<text x="765" y="355" fill="#B5C4D9" font-size="11" font-weight="500" text-anchor="middle">residual</text>
<rect x="776.8" y="797" width="66.4" height="20" rx="5" fill="#101827"/>
<text x="810" y="811" fill="#B5C4D9" font-size="11" font-weight="500" text-anchor="middle">residual</text>
<text x="48" y="1178" fill="#B5C4D9" font-size="11" font-weight="400" text-anchor="start">Pre-norm variant. Dropout, positional encoding, and the output language-model head are omitted.</text>
</g></svg>
