<path d="M 60 237 H 228 V 405 M 228 237 L 240 225" fill="none" stroke="#2563EB" stroke-width="1.2"/>
<text x="150" y="299.5" fill="#2563EB" font-size="8.5" font-weight="600" text-anchor="middle">NCHW / BATCH OMITTED</text>
