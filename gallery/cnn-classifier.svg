<text x="1200" y="534.5" fill="#14263D" font-size="15" font-weight="600" text-anchor="middle">classifier</text>
<text x="1200" y="558.5" fill="#52627A" font-size="11.5" font-weight="400" text-anchor="middle">10 logits</text>
