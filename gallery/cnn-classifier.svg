<text x="224" y="108" fill="#52627A" font-size="10.5" font-weight="400" text-anchor="start">Control</text>
<path d="M 316 104 h 28" stroke="#52627A" stroke-width="1.7" fill="none" stroke-dasharray="2 5"/>
<text x="352" y="108" fill="#52627A" font-size="10.5" font-weight="400" text-anchor="start">Feedback</text>
<path d="M 240 315 L 280 315 L 320 315" stroke="#52627A" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 510 315 L 550 315 L 590 315" stroke="#52627A" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 770 315 L 810 315 L 850 315" stroke="#52627A" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 1040 315 L 1080 315 L 1120 315" stroke="#52627A" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 1200 367 L 1200 426 L 1200 485" stroke="#52627A" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
