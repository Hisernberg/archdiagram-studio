<rect x="1163.65" y="416" width="72.7" height="20" rx="5" fill="#FFFFFF"/>
<text x="1200" y="430" fill="#52627A" font-size="11" font-weight="500" text-anchor="middle">128 -&gt; 10</text>
<text x="48" y="638" fill="#52627A" font-size="11" font-weight="400" text-anchor="start">Spatial dimensions assume suitable padding. This is an illustrative classification network.</text>
