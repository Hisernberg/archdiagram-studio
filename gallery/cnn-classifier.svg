<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="660" viewBox="0 0 1320 660" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Convolutional feature hierarchy</title>
<desc id="diagram-description">Feature-map dimensions are explicit; geometric depth is illustrative.. image: Input image 3 x 224 x 224; conv1: Conv + activation 64 x 112 x 112; pool: Max pool 64 x 56 x 56; conv2: Conv + activation 128 x 28 x 28; poolhead: Global avg pool B x 128; logits: Linear classifier 10 logits. image to conv1: stride 2 (data); conv1 to pool: 2 x 2 (data); pool to conv2: stride 2 (data); conv2 to poolhead:  (data); poolhead to logits: 128 -&gt; 10 (data)</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#52627A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Inter, DejaVu Sans, Arial, sans-serif">
