<text x="48" y="77" fill="#52627A" font-size="13" font-weight="400" text-anchor="start">Feature-map dimensions are explicit; geometric depth is illustrative.</text>
<path d="M 48 104 h 28" stroke="#52627A" stroke-width="1.7" fill="none" stroke-dasharray=""/>
