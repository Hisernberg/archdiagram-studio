<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Message-passing graph network</title>
<desc id="diagram-description">Separate edge messages, neighborhood aggregation, and node updates.. graph: Graph features Nodes h_i, edges e_ij; messages: Message function m_ij = M(h_i, h_j, e_ij); aggregate: Aggregate neighbors Permutation invariant; update: Update node state h_i next = U(h_i, m_i); readout: Graph readout Pool node embeddings. graph to messages: neighbors (data); messages to aggregate: messages (data); aggregate to update: aggregated (data); graph to update: initial h_i (data); update to messages: next round (feedback); update to readout: node embeddings (data)</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#45647D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="100%" height="100%" fill="#F1F7FC"/>
<g font-family="Inter, DejaVu Sans, Arial, sans-serif">
<text x="48" y="50" fill="#123452" font-size="29" font-weight="700" text-anchor="start">Message-passing graph network</text>
<text x="48" y="77" fill="#45647D" font-size="13" font-weight="400" text-anchor="start">Separate edge messages, neighborhood aggregation, and node updates.</text>
<path d="M 48 104 h 28" stroke="#45647D" stroke-width="1.7" fill="none" stroke-dasharray=""/>
<text x="84" y="108" fill="#45647D" font-size="10.5" font-weight="400" text-anchor="start">Data flow</text>
<path d="M 188 104 h 28" stroke="#45647D" stroke-width="1.7" fill="none" stroke-dasharray="7 5"/>
<text x="224" y="108" fill="#45647D" font-size="10.5" font-weight="400" text-anchor="start">Control</text>
<path d="M 316 104 h 28" stroke="#45647D" stroke-width="1.7" fill="none" stroke-dasharray="2 5"/>
<text x="352" y="108" fill="#45647D" font-size="10.5" font-weight="400" text-anchor="start">Feedback</text>
<g data-group="rounds"><rect x="292" y="155" width="625" height="465" rx="14" fill="#E7F0F8" stroke="#A4BDD1" stroke-dasharray="5 5"/>
<text x="310" y="180" fill="#45647D" font-size="11" font-weight="600" text-anchor="start">Message passing / K rounds</text>
</g>
<path d="M 240 280 L 295 280 L 350 280" stroke="#45647D" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 580 280 L 635 280 L 690 280" stroke="#45647D" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 785 330 L 785 396 L 465 396 L 465 460" stroke="#45647D" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 240 280 L 280 280 L 280 585 L 465 585 L 465 560" stroke="#45647D" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 350 510 L 309 510 L 309 205 L 465 205 L 465 230" stroke="#45647D" stroke-width="1.8" fill="none" stroke-dasharray="2 5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 580 510 L 765 510 L 950 510" stroke="#45647D" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<g id="node-graph" data-role="input"><title>Graph features: Nodes h_i, edges e_ij</title>
<rect x="60" y="230" width="180" height="100" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
<path d="M 72 244 v 72" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
<text x="150" y="273.5" fill="#123452" font-size="15" font-weight="600" text-anchor="middle">Graph features</text>
<text x="150" y="297.5" fill="#45647D" font-size="11.5" font-weight="400" text-anchor="middle">Nodes h_i, edges e_ij</text>
</g>
<g id="node-messages" data-role="model"><title>Message function: m_ij = M(h_i, h_j, e_ij)</title>
<rect x="350" y="230" width="230" height="100" rx="10" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.6"/>
<path d="M 362 244 v 72" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
<text x="465" y="273.5" fill="#123452" font-size="15" font-weight="600" text-anchor="middle">Message function</text>
<text x="465" y="297.5" fill="#45647D" font-size="11.5" font-weight="400" text-anchor="middle">m_ij = M(h_i, h_j, e_ij)</text>
</g>
<g id="node-aggregate" data-role="compute"><title>Aggregate neighbors: Permutation invariant</title>
<rect x="690" y="230" width="190" height="100" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.6"/>
<path d="M 702 244 v 72" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
<text x="785" y="273.5" fill="#123452" font-size="15" font-weight="600" text-anchor="middle">Aggregate neighbors</text>
<text x="785" y="297.5" fill="#45647D" font-size="11.5" font-weight="400" text-anchor="middle">Permutation invariant</text>
</g>
<g id="node-update" data-role="model"><title>Update node state: h_i next = U(h_i, m_i)</title>
<rect x="350" y="460" width="230" height="100" rx="10" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.6"/>
<path d="M 362 474 v 72" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
<text x="465" y="503.5" fill="#123452" font-size="15" font-weight="600" text-anchor="middle">Update node state</text>
<text x="465" y="527.5" fill="#45647D" font-size="11.5" font-weight="400" text-anchor="middle">h_i next = U(h_i, m_i)</text>
</g>
<g id="node-readout" data-role="output"><title>Graph readout: Pool node embeddings</title>
<rect x="950" y="460" width="190" height="100" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="1.6"/>
<path d="M 962 474 v 72" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
<text x="1045" y="503.5" fill="#123452" font-size="15" font-weight="600" text-anchor="middle">Graph readout</text>
<text x="1045" y="527.5" fill="#45647D" font-size="11.5" font-weight="400" text-anchor="middle">Pool node embeddings</text>
</g>
<rect x="258.65" y="253" width="72.7" height="20" rx="5" fill="#F1F7FC"/>
<text x="295" y="267" fill="#45647D" font-size="11" font-weight="500" text-anchor="middle">neighbors</text>
<rect x="601.8" y="253" width="66.4" height="20" rx="5" fill="#F1F7FC"/>
<text x="635" y="267" fill="#45647D" font-size="11" font-weight="500" text-anchor="middle">messages</text>
<rect x="641.5" y="370" width="79" height="20" rx="5" fill="#F1F7FC"/>
<text x="681" y="384" fill="#45647D" font-size="11" font-weight="500" text-anchor="middle">aggregated</text>
<rect x="237.35" y="420" width="85.3" height="20" rx="5" fill="#F1F7FC"/>
<text x="280" y="434" fill="#45647D" font-size="11" font-weight="500" text-anchor="middle">initial h_i</text>
<rect x="269.5" y="349" width="79" height="20" rx="5" fill="#F1F7FC"/>
<text x="309" y="363" fill="#45647D" font-size="11" font-weight="500" text-anchor="middle">next round</text>
<rect x="715.75" y="482" width="110.5" height="20" rx="5" fill="#F1F7FC"/>
<text x="771" y="496" fill="#45647D" font-size="11" font-weight="500" text-anchor="middle">node embeddings</text>
<text x="48" y="678" fill="#45647D" font-size="11" font-weight="400" text-anchor="start">M and U are task-dependent functions; readout can be omitted for node-level prediction.</text>
</g></svg>
