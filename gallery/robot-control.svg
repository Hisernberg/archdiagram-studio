<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="760" viewBox="0 0 1250 760" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Perception-to-action control loop</title>
<desc id="diagram-description">Keep goals, commands, physical dynamics, and observations distinct.. sensors: Sensors Images, depth, encoders; perception: State estimation Perception and fusion; policy: Policy / planner Choose the next action; actuators: Actuators Apply bounded commands; world: Robot + environment Physical state evolves; goal: Task goal Targets and constraints. sensors to perception: observations (data); perception to policy: estimated state (data); policy to actuators: command (control); actuators to world: state change (data); world to sensors: new observation (feedback); goal to policy: objective (control)</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#52627A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Inter, DejaVu Sans, Arial, sans-serif">
<text x="48" y="50" fill="#14263D" font-size="29" font-weight="700" text-anchor="start">Perception-to-action control loop</text>
<text x="48" y="77" fill="#52627A" font-size="13" font-weight="400" text-anchor="start">Keep goals, commands, physical dynamics, and observations distinct.</text>
<path d="M 48 104 h 28" stroke="#52627A" stroke-width="1.7" fill="none" stroke-dasharray=""/>
