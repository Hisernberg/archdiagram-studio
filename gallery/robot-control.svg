<text x="388" y="477" fill="#52627A" font-size="11" font-weight="600" text-anchor="start">Physical system</text>
</g>
<path d="M 280 267 L 340 267 L 400 267" stroke="#52627A" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 630 267 L 705 267 L 780 267" stroke="#52627A" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 895 314 L 895 407 L 895 500" stroke="#52627A" stroke-width="1.8" fill="none" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 780 547 L 705 547 L 630 547" stroke="#52627A" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
