<text x="165" y="515.5" fill="#141414" font-size="15" font-weight="600" text-anchor="middle">Query encoder</text>
<text x="165" y="539.5" fill="#505050" font-size="11.5" font-weight="400" text-anchor="middle">Embed user question</text>
</g>
<g id="node-retrieve" data-role="compute"><title>Retrieve + rerank: Select relevant evidence</title>
<rect x="365" y="465" width="220" height="96" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<path d="M 377 479 v 68" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
<text x="475" y="506.5" fill="#141414" font-size="15" font-weight="600" text-anchor="middle">Retrieve + rerank</text>
<text x="475" y="530.5" fill="#505050" font-size="11.5" font-weight="400" text-anchor="middle">Select relevant evidence</text>
</g>
<g id="node-generate" data-role="model"><title>Context + generator: Answer from evidence</title>
