<text x="629" y="500" fill="#505050" font-size="11" font-weight="500" text-anchor="middle">evidence</text>
<rect x="921.1" y="486" width="53.8" height="20" rx="5" fill="#FFFFFF"/>
<text x="948" y="500" fill="#505050" font-size="11" font-weight="500" text-anchor="middle">answer</text>
<text x="48" y="658" fill="#505050" font-size="11" font-weight="400" text-anchor="start">Document and query encoders use compatible embedding spaces. Retrieved text remains untrusted input.</text>
</g></svg>
