<text x="1105" y="270.5" fill="#505050" font-size="11.5" font-weight="400" text-anchor="middle">Vectors + metadata</text>
</g>
<g id="node-query" data-role="model"><title>Query encoder: Embed user question</title>
<rect x="60" y="465" width="210" height="96" rx="0" fill="#F7F7F7" stroke="#222222" stroke-width="1.6"/>
<path d="M 72 479 v 68" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
