<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Retrieval-augmented generation</title>
<desc id="diagram-description">Separate indexing from query-time retrieval; keep the evidence path visible.. sources: Source documents Files, pages, records; chunks: Chunk + normalize Preserve source IDs; encoder: Document encoder Map chunks to vectors; index: Vector index Vectors + metadata; query: Query encoder Embed user question; retrieve: Retrieve + rerank Select relevant evidence; generate: Context + generator Answer from evidence; response: Cited response Source-linked answer. sources to chunks:  (data); chunks to encoder:  (data); encoder to index: upsert (data); query to retrieve: query vector (data); index to retrieve: retrieved candidates (data); retrieve to generate: evidence (data); generate to response: answer (data)</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Latin Modern Roman, Times New Roman, serif">
<text x="48" y="50" fill="#141414" font-size="29" font-weight="700" text-anchor="start">Retrieval-augmented generation</text>
<text x="48" y="77" fill="#505050" font-size="13" font-weight="400" text-anchor="start">Separate indexing from query-time retrieval; keep the evidence path visible.</text>
<path d="M 48 104 h 28" stroke="#303030" stroke-width="1.7" fill="none" stroke-dasharray=""/>
<text x="84" y="108" fill="#505050" font-size="10.5" font-weight="400" text-anchor="start">Data flow</text>
<path d="M 188 104 h 28" stroke="#303030" stroke-width="1.7" fill="none" stroke-dasharray="7 5"/>
<text x="224" y="108" fill="#505050" font-size="10.5" font-weight="400" text-anchor="start">Control</text>
<path d="M 316 104 h 28" stroke="#303030" stroke-width="1.7" fill="none" stroke-dasharray="2 5"/>
<text x="352" y="108" fill="#505050" font-size="10.5" font-weight="400" text-anchor="start">Feedback</text>
<path d="M 270 253 L 317.5 253 L 365 253" stroke="#303030" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 585 253 L 630 253 L 675 253" stroke="#303030" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 895 253 L 947.5 253 L 1000 253" stroke="#303030" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 270 513 L 317.5 513 L 365 513" stroke="#303030" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 1105 301 L 1105 382 L 475 382 L 475 465" stroke="#303030" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 585 513 L 630 513 L 675 513" stroke="#303030" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 895 513 L 947.5 513 L 1000 513" stroke="#303030" stroke-width="1.8" fill="none" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<g id="node-sources" data-role="input"><title>Source documents: Files, pages, records</title>
<rect x="60" y="205" width="210" height="96" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<path d="M 72 219 v 68" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
<text x="165" y="237.5" fill="#222222" font-size="8.5" font-weight="600" text-anchor="middle">INDEXING</text>
<text x="165" y="255.5" fill="#141414" font-size="15" font-weight="600" text-anchor="middle">Source documents</text>
<text x="165" y="279.5" fill="#505050" font-size="11.5" font-weight="400" text-anchor="middle">Files, pages, records</text>
</g>
<g id="node-chunks" data-role="compute"><title>Chunk + normalize: Preserve source IDs</title>
<rect x="365" y="205" width="220" height="96" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<path d="M 377 219 v 68" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
