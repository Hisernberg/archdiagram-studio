<path d="M 687 479 v 68" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
<text x="785" y="506.5" fill="#141414" font-size="15" font-weight="600" text-anchor="middle">Context + generator</text>
<text x="785" y="530.5" fill="#505050" font-size="11.5" font-weight="400" text-anchor="middle">Answer from evidence</text>
</g>
<g id="node-response" data-role="output"><title>Cited response: Source-linked answer</title>
<rect x="1000" y="465" width="210" height="96" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<path d="M 1012 479 v 68" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
<text x="1105" y="506.5" fill="#141414" font-size="15" font-weight="600" text-anchor="middle">Cited response</text>
<text x="1105" y="530.5" fill="#505050" font-size="11.5" font-weight="400" text-anchor="middle">Source-linked answer</text>
</g>
