<text x="947" y="240" fill="#505050" font-size="11" font-weight="500" text-anchor="middle">upsert</text>
<rect x="271.2" y="486" width="91.6" height="20" rx="5" fill="#FFFFFF"/>
<text x="317" y="500" fill="#505050" font-size="11" font-weight="500" text-anchor="middle">query vector</text>
<rect x="719" y="355" width="142" height="20" rx="5" fill="#FFFFFF"/>
<text x="790" y="369" fill="#505050" font-size="11" font-weight="500" text-anchor="middle">retrieved candidates</text>
