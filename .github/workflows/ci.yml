name: Validate skill and diagrams
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install export tools
        run: sudo apt-get update && sudo apt-get install -y inkscape texlive-latex-extra texlive-luatex texlive-fonts-recommended fonts-dejavu-core poppler-utils
      - name: Rebuild every example and compile native templates
        run: python scripts/build_gallery.py --compile-tex
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-figures
          path: gallery/
